<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipes Mission</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>💧 Pipes Mission</h1>
    <p>Every drop counts!</p>
  </header>

  <main>
    <section class="game">
      <h2>Save the Water</h2>
      <p>Connect the pipes and help the water reach its destination.</p>

      <button id="startButton">Start Game</button>
<div class="scoreboard">
  <div>
    <span>🏆 Score</span>
    <strong id="score">1000</strong>
  </div>

  <div>
    <span>🔄 Moves</span>
    <strong id="moves">0</strong>
  </div>

  <div>
    <span>⭐ Best</span>
    <strong id="bestScore">0</strong>
  </div>
</div>
      <div id="gameArea"></div>

      <p id="message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
