<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pipes Mission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-card">
  <!-- Header -->
  <div class="header-bar">
    <button class="btn-icon" id="btn-back" title="Restart Level">←</button>
    <div class="level-title" id="level-title">LEVEL 1 — PIPE REPAIR</div>
    <div class="top-controls">
      <button class="btn-icon" id="btn-pause" title="Pause">⏸</button>
      <button class="btn-icon" id="btn-hint" title="Hint">💡</button>
      <button class="btn-icon" id="btn-settings" title="Settings">⚙</button>
    </div>
  </div>

  <!-- Stats Panel -->
  <div class="stats-panel">
    <div class="stat-box">
      <div class="stat-label">Target</div>
      <div class="stat-value">FILL BUCKET <span id="target-pct">0%</span></div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>
    <div class="stat-box stat-right">
      <div class="stat-label">Time</div>
      <div class="stat-value" id="timer">02:00</div>
      <div class="stat-label moves-label">Moves: <span id="moves">0</span></div>
      <div class="stat-label">Score: <span id="score">0</span></div>
    </div>
  </div>

  <button class="btn-start" id="btn-start" type="button">START</button>

  <!-- Board Container -->
  <div class="board-container">
    <div class="faucet" role="img" aria-label="Faucet">🚰</div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="game-status" id="game-status" aria-live="polite"></div>
</div>

<script src="script.js"></script>
</body>
</html>
