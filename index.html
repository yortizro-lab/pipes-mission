<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipes Mission</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>💧 Pipes Mission</h1>
    <p>Every drop counts!</p>
  </header>

  <main>
    <section class="game-card">

      <h2>Fix the Pipes</h2>
      <p class="instructions">
        Repair the broken pipes and connect the faucet to the water exit!
      </p>

      <div class="stats">
        <div>
          🏆 Score
          <strong id="score">1000</strong>
        </div>

        <div>
          ⭐ Level
          <strong id="level">1</strong>
        </div>

        <div>
          🔄 Moves
          <strong id="moves">0</strong>
        </div>
      </div>

      <div class="timer">
        ⏱️ Time: <span id="timer">30</span>
      </div>

      <!-- WATER SYSTEM -->
      <div id="waterSystem">

        <div class="faucet">
          🚰
          <span>START</span>
        </div>

      <div id="pipeBoard">

  <div class="faucet">
    🚰
    <span>WATER START</span>
  </div>

  <div id="waterFlow"></div>

</div>

<div class="exit">
  💧
  <span>EXIT</span>
</div>
